[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["src/data/questionBankEmbedded.json"]

[[redirects]]
  from = "/api/interview"
  to = "/.netlify/functions/interview"
  status = 200
  force = true

[[redirects]]
  from = "/api/retrieve"
  to = "/.netlify/functions/retrieve"
  status = 200
  force = true

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
