
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ClutchAI - Hardcore psychological pressure simulator for high-stakes interview preparation. Master the mental game with Groq-powered speed insights.">
    <meta property="og:title" content="ClutchAI | Pressure Simulator">
    <meta property="og:description" content="Simulate high-stakes interview pressure with real-time neural telemetry and Groq AI coaching.">
    <title>ClutchAI | Pressure Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07080b;
            --bg-2: #0c111a;
            --ink: #e6edf3;
            --muted: #9aa4b2;
            --accent: #3b82f6;
            --accent-2: #f59e0b;
            --card: #0f131b;
            --stroke: rgba(255, 255, 255, 0.08);
            --glow: rgba(59, 130, 246, 0.35);
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(1200px 700px at 10% -10%, rgba(59, 130, 246, 0.18), transparent 60%),
                        radial-gradient(900px 600px at 90% 10%, rgba(245, 158, 11, 0.12), transparent 55%),
                        linear-gradient(180deg, var(--bg), var(--bg-2));
            color: var(--ink);
            overflow: hidden;
        }
        .font-display {
            font-family: 'Fraunces', serif;
        }
        .glass-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
            border: 1px solid var(--stroke);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 9999px;
            border: 1px solid var(--stroke);
            background: rgba(255, 255, 255, 0.04);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--muted);
        }
        .mesh-bg {
            background-image:
                radial-gradient(800px 500px at 20% 0%, rgba(59, 130, 246, 0.18), transparent 60%),
                radial-gradient(700px 500px at 80% 10%, rgba(245, 158, 11, 0.16), transparent 60%),
                radial-gradient(900px 600px at 50% 90%, rgba(14, 116, 144, 0.14), transparent 65%);
        }
        @keyframes reveal-up {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .reveal-up { animation: reveal-up 0.8s ease both; }
        .reveal-delay-1 { animation-delay: 0.12s; }
        .reveal-delay-2 { animation-delay: 0.24s; }
        .reveal-delay-3 { animation-delay: 0.36s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.1s ease-in-out infinite;
        }
        .bg-panic-glow {
            box-shadow: inset 0 0 100px rgba(239, 68, 68, 0.15);
        }
        .gauge-transition {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* NEW ANIMATIONS FOR HOME SCREEN */
        @keyframes grid-move {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }
        .bg-grid-animate {
            background-image: linear-gradient(to right, rgba(30, 41, 59, 0.3) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(30, 41, 59, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 2s linear infinite;
        }
        @keyframes drift {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }
        .floating-particle {
            position: absolute;
            background: #3b82f6;
            border-radius: 50%;
            pointer-events: none;
            animation: drift var(--duration) linear infinite;
            animation-delay: var(--delay);
            left: var(--left);
            bottom: -20px;
            width: var(--size);
            height: var(--size);
            filter: blur(1px);
        }
        @keyframes scan {
            0% { top: -10%; opacity: 0; }
            50% { opacity: 0.1; }
            100% { top: 110%; opacity: 0; }
        }
        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #3b82f6, transparent);
            box-shadow: 0 0 20px #3b82f6;
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes sonar {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .sonar-effect::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            background: #3b82f6;
            animation: sonar 2s infinite;
            z-index: -1;
        }
    </style>
