<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="ClutchAI - Hardcore psychological pressure simulator for high-stakes interview preparation. Master the mental game with high-speed AI insights.">
    <meta property="og:title" content="ClutchAI | Pressure Simulator">
    <meta property="og:description"
        content="Simulate high-stakes interview pressure with real-time neural telemetry and adaptive AI coaching.">
    <title>ClutchAI | Pressure Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #060810;
            --bg-2: #0a0e1a;
            --ink: #e6edf3;
            --muted: #9aa4b2;
            --accent: #3b82f6;
            --accent-2: #f59e0b;
            --card: #0c1120;
            --stroke: rgba(255, 255, 255, 0.07);
            --glow: rgba(59, 130, 246, 0.45);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--ink);
            overflow: hidden;
        }

        /* ── Animated aurora background blobs ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 900px 700px at 5% -5%, rgba(59,130,246,0.22), transparent 55%),
                radial-gradient(ellipse 700px 600px at 95% 5%,  rgba(139,92,246,0.18), transparent 50%),
                radial-gradient(ellipse 800px 500px at 50% 95%, rgba(16,185,129,0.12), transparent 55%),
                radial-gradient(ellipse 600px 400px at 80% 60%, rgba(245,158,11,0.08), transparent 50%);
            animation: aurora-drift 18s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes aurora-drift {
            0%   { opacity: 1; transform: scale(1)   translateY(0px); }
            50%  { opacity: 0.8; transform: scale(1.04) translateY(-20px); }
            100% { opacity: 1; transform: scale(1)   translateY(0px); }
        }

        /* Grain noise overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }

        .font-display {
            font-family: 'Fraunces', serif;
        }

        /* ── Glass cards ── */
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.018) 100%);
            border: 1px solid rgba(255,255,255,0.09);
            box-shadow: 0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
        }

        /* ── Gradient text ── */
        .gradient-text {
            background: linear-gradient(135deg, #e2e8f0 0%, #93c5fd 40%, #a78bfa 70%, #6ee7b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gradient-text-fire {
            background: linear-gradient(135deg, #fde68a 0%, #fb923c 40%, #f43f5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Animated gradient border ── */
        .glow-border {
            position: relative;
        }
        .glow-border::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(59,130,246,0.6), rgba(139,92,246,0.5), rgba(16,185,129,0.4));
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }
        .glow-border:hover::before { opacity: 1; }

        /* ── Chip ── */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            border: 1px solid rgba(59,130,246,0.3);
            background: rgba(59,130,246,0.08);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: #93c5fd;
        }

        /* ── Glow button ── */
        .btn-glow {
            position: relative;
            overflow: hidden;
        }
        .btn-glow::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.12) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }
        .btn-glow:hover::after { transform: translateX(100%); }

        /* ── Shimmer skeleton ── */
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position:  200% 0; }
        }
        .shimmer-border {
            border-image: linear-gradient(90deg, rgba(59,130,246,0.1), rgba(139,92,246,0.5), rgba(59,130,246,0.1)) 1;
            animation: shimmer 3s linear infinite;
        }

        /* ── Glowing orbs (decorative) ── */
        .orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(60px);
            pointer-events: none;
        }

        .mesh-bg {
            background-image:
                radial-gradient(800px 500px at 20% 0%, rgba(59, 130, 246, 0.18), transparent 60%),
                radial-gradient(700px 500px at 80% 10%, rgba(245, 158, 11, 0.16), transparent 60%),
                radial-gradient(900px 600px at 50% 90%, rgba(14, 116, 144, 0.14), transparent 65%);
        }

        /* ── Stat number glow ── */
        .stat-num {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        /* ── Section divider ── */
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(59,130,246,0.4) 30%, rgba(139,92,246,0.4) 70%, transparent 100%);
        }

        /* ── Card accent line ── */
        .card-accent-blue  { box-shadow: inset 3px 0 0 #3b82f6; }
        .card-accent-purple{ box-shadow: inset 3px 0 0 #8b5cf6; }
        .card-accent-green { box-shadow: inset 3px 0 0 #10b981; }
        .card-accent-amber { box-shadow: inset 3px 0 0 #f59e0b; }
        .card-accent-rose  { box-shadow: inset 3px 0 0 #f43f5e; }
        .card-accent-cyan  { box-shadow: inset 3px 0 0 #06b6d4; }

        @keyframes reveal-up {
            0% {
                opacity: 0;
                transform: translateY(14px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal-up {
            animation: reveal-up 0.8s ease both;
        }

        .reveal-delay-1 {
            animation-delay: 0.12s;
        }

        .reveal-delay-2 {
            animation-delay: 0.24s;
        }

        .reveal-delay-3 {
            animation-delay: 0.36s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .animate-shake {
            animation: shake 0.1s ease-in-out infinite;
        }

        .bg-panic-glow {
            box-shadow: inset 0 0 100px rgba(239, 68, 68, 0.15);
        }

        .gauge-transition {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* NEW ANIMATIONS FOR HOME SCREEN */
        @keyframes grid-move {
            0% {
                transform: perspective(500px) rotateX(60deg) translateY(0);
            }

            100% {
                transform: perspective(500px) rotateX(60deg) translateY(50px);
            }
        }

        .bg-grid-animate {
            background-image: linear-gradient(to right, rgba(30, 41, 59, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 2s linear infinite;
        }

        @keyframes drift {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            20% {
                opacity: 0.6;
            }

            80% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-100vh) translateX(20px);
                opacity: 0;
            }
        }

        .floating-particle {
            position: absolute;
            background: #3b82f6;
            border-radius: 50%;
            pointer-events: none;
            animation: drift var(--duration) linear infinite;
            animation-delay: var(--delay);
            left: var(--left);
            bottom: -20px;
            width: var(--size);
            height: var(--size);
            filter: blur(1px);
        }

        @keyframes scan {
            0% {
                top: -10%;
                opacity: 0;
            }

            50% {
                opacity: 0.1;
            }

            100% {
                top: 110%;
                opacity: 0;
            }
        }

        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #3b82f6, transparent);
            box-shadow: 0 0 20px #3b82f6;
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes sonar {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .sonar-effect::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            background: #3b82f6;
            animation: sonar 2s infinite;
            z-index: -1;
        }

        @keyframes spin-reverse {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }
        }

        .animate-spin-reverse {
            animation: spin-reverse 1s linear infinite;
        }
    </style>
